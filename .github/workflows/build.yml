# Three channels, and the release list only grows when a version is cut:
#
#   ci        every push to main — lint, tests and the web bundle, which is then thrown
#             away. Nothing is deployed and nothing is released; the build is here so a
#             broken bundle fails the push (`tsc -b` covers desktop/ through
#             tsconfig.desktop.json, so a main-process type error is caught here too).
#             Only the packaging step waits for the nightly.
#   nightly   a daily cron (and manual dispatch) — installers for Windows, macOS and
#             Linux plus a zip of the web bundle, on ONE rolling prerelease whose tag
#             `nightly` is force-moved to the commit it was built from and whose assets
#             are replaced in place. It is never deleted and never recreated, so the
#             download counts survive and nobody watching releases is re-notified. The
#             cron exits early when main has not moved since the last one. That same web
#             zip is unpacked onto nightly.editor.scmjs.dev, so the hosted nightly and the
#             nightly installers are one build carrying one version string.
#   vX.Y.Z    a tag — a permanent release with the same assets, the container image on
#             GHCR, the GitHub Pages deploy of editor.scmjs.dev, and notes: `docs/releases/<version>.md` from the tag's own tree (or
#             the `notes` dispatch input, which wins) above GitHub's generated list of
#             commits, and the generated list alone when neither is there. These are the
#             only releases that accumulate, which is the point. `release.yml` is what
#             cuts one: it tags, dispatches this workflow on the tag, and moves
#             package.json on to the next version so the nightlies keep sorting above it.
#
# The container image (`docker/Dockerfile`, pushed by the `image` job to
# `ghcr.io/<owner>/<repo>`) is nginx with the release's own web bundle in it — the very zip
# the release carries, unzipped, never rebuilt — so anyone can run the editor with
#
#   docker run --rm -p 8080:80 ghcr.io/scm-js/scm-js:latest
#
# Tagged releases only: an image tagged `latest` is what a `docker run` picks up without
# asking, so nothing but a version cut on purpose goes there. It carries no game data
# either (`.dockerignore` cuts the extracted trees out of the build context), so a
# container asks through Help ▸ Game Data… exactly like the hosted build.
#
# Download links for scmjs.dev. GitHub redirects `/releases/latest/download/<asset>` to
# the newest release that is NOT a prerelease or a draft, so the stable buttons are plain
# hrefs that never need updating and never touch the API:
#
#   https://github.com/scm-js/scm-js/releases/latest/download/scmJS-windows-x64-setup.exe
#   https://github.com/scm-js/scm-js/releases/latest/download/scmJS-linux-x86_64.AppImage
#   https://github.com/scm-js/scm-js/releases/latest/download/scmJS-linux-amd64.deb
#   https://github.com/scm-js/scm-js/releases/latest/download/scmJS-macos-arm64.dmg
#   https://github.com/scm-js/scm-js/releases/download/nightly/scmJS-windows-x64-setup.exe
#
# That is why `electron-builder.yml` names the assets without the version in them: the
# redirect can only work against a fixed file name. The version is in the release title,
# the notes and `latest*.yml`. To un-promote a bad stable release, tick "This is a
# pre-release" on it and the redirect falls back to the one before it — no new tag.
#
# The hosted editor is a release, like every other way of running this:
#
#   editor.scmjs.dev          the newest tag, deployed by the `pages` job on the stable
#                             channel — the same commit as the installers, the same
#                             version in About, the same notes to read.
#   nightly.editor.scmjs.dev  main as of the last nightly, deployed by the `nightly-site`
#                             job into scm-js/nightly's gh-pages branch (one force-pushed
#                             orphan commit, so that repository never grows).
#
# They are separate origins on purpose and it costs something: the extracted game data
# lives in OPFS and every `scmjs.` setting in localStorage, both scoped to the origin, so
# trying the nightly means installing the game data again and it keeps its own
# preferences, recents and installed plugins. That is the price of a nightly that cannot
# write a stored shape the stable build then reads.
#
# To put editor.scmjs.dev back on an older version, dispatch this workflow on that tag —
# the deploy is the only thing a re-run rewrites (`gh release create` would refuse the
# existing tag, and nothing else in a stable run is idempotent-unsafe). Un-promoting a
# release moves the download redirect but not the site.
#
# Repository variables (Settings ▸ Variables): PAGES_BASE is the hosted build's base path
# ("/" for a custom domain; the default is the repository name), and NIGHTLY_DOMAIN is the
# custom domain written into the nightly site's CNAME — unset, and the nightly deploy is
# skipped, as it is without the NIGHTLY_PAT secret — a fine-grained token whose only
# permission is Contents: write on <owner>/nightly, kept as a *repository* secret rather
# than an organisation one like PLUGIN_API_PAT, since only this workflow reads it. Neither
# missing is an error: a fork builds and releases without either. No build carries game
# data or an address to fetch it from — every one of them looks on the user's disk and
# otherwise asks (src/gamedata/source.ts). Nothing here has, or needs, the game data: the
# real-data test suites skip in CI.
#
# Code signing: none yet. Windows shows SmartScreen's "unrecognized app" screen, and macOS
# refuses an unsigned app until the user runs `xattr -d com.apple.quarantine`; the Linux
# builds and the web build have no such friction. In-app updates (electron-updater reads
# the `latest*.yml` these jobs upload) work unsigned on Windows and AppImage; macOS needs
# a real identity before Squirrel.Mac will install anything.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # 07:17 UTC. Scheduled workflows run on the default branch only, and GitHub disables
    # them after 60 days with no repository activity.
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: Build installers and publish the nightly prerelease
        type: boolean
        default: false
      notes:
        description: "Release notes for a tagged build. Blank reads docs/releases/<version>.md, and with neither the release carries the generated list alone."
        type: string
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  channel:
    name: Channel
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.pick.outputs.channel }}
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/next-version.mjs reads the release tags.
          fetch-depth: 0
      - id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_NIGHTLY: ${{ inputs.nightly }}
        run: |
          set -euo pipefail
          # package.json records the LAST released version; nothing has to remember to move
          # it on. What a nightly is called is worked out from the release tags by
          # scripts/next-version.mjs (a patch bump of the newest one), which is the only
          # choice that can never sort above the release that comes next.
          pkg=$(node -p "require('./package.json').version")
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag=${GITHUB_REF#refs/tags/}
            if [[ "${tag#v}" != "$pkg" ]]; then
              echo "::warning::tag $tag does not match package.json ($pkg); building as ${tag#v}"
            fi
            emit channel stable
            emit tag "$tag"
            emit version "${tag#v}"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$DISPATCH_NIGHTLY" == "true" ]]; then
            # Nothing to build if main has not moved since the nightly tag was placed.
            if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
              at=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" -q .object.sha 2>/dev/null || true)
              if [[ "$at" == "$GITHUB_SHA" ]]; then
                echo "nightly is already at ${GITHUB_SHA:0:7}"
                emit channel skip; emit tag ""; emit version "$pkg"
                exit 0
              fi
            fi
            # A prerelease of the version being worked towards, ordered by run number so two
            # nightlies on the same day still compare correctly (a short SHA would not:
            # semver compares alphanumeric identifiers lexically).
            emit channel nightly
            emit tag nightly
            emit version "$(node scripts/next-version.mjs)-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
            exit 0
          fi

          emit channel ci
          emit tag ""
          emit version "$(node scripts/next-version.mjs)-dev.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"

  web:
    name: Web
    needs: channel
    if: needs.channel.outputs.channel != 'skip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # This job lints, tests and runs Vite; nothing here launches Electron, and every
      # `electron` import lives under `desktop/`. Without this, electron's postinstall
      # pulls a 282 MB binary into ~/.cache/electron — which setup-node's `cache: npm`
      # (~/.npm) does not cover — on every run, and on the `ci` channel this is the only
      # job there is. `electron.d.ts` ships in the npm package, so `tsc -b`'s
      # tsconfig.desktop.json reference still type-checks. The Desktop jobs run on their
      # own runners with their own `npm ci` and are unaffected.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm version --no-git-tag-version "${{ needs.channel.outputs.version }}"
      - run: npm run lint
      - run: npm test
      # The default plugins are compiled into the bundle rather than fetched at startup
      # (`scripts/vendor-plugins.mjs`, run by `prebuild`), which is worth 890 KB gzipped
      # off a first visit but takes the remote loading path off the path everyone walks.
      # This is what still walks it: one plugin fetched, transpiled and imported for real.
      # It needs GitHub, which the build below needs anyway, so it adds no new dependency.
      - name: Test (network)
        run: npx vitest run tests/plugin-network.test.ts
        env:
          SCMJS_NETWORK_TESTS: "1"
      # Built on every channel, including the one that ships nothing: a broken bundle
      # should fail the push that broke it, not the tag a fortnight later. It is also the
      # bundle the release zip, the container image and the nightly site all carry —
      # served from the root of wherever it is put.
      - name: Build
        run: npm run build
        env:
          SCMJS_BASE: /
          # For `prebuild`'s vendoring step: one file-list request per plugin, off the
          # anonymous rate limit runners share.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Zip
        if: needs.channel.outputs.channel != 'ci'
        run: cd dist && zip -qr ../scmJS-web.zip .
      - uses: actions/upload-artifact@v4
        if: needs.channel.outputs.channel != 'ci'
        with:
          name: web-zip
          path: scmJS-web.zip
          if-no-files-found: error
      # The same bundle again under the path GitHub Pages serves this repository from —
      # only when that is not the root, which is to say only for a fork with no custom
      # domain. editor.scmjs.dev is at the root and takes the build above as it is, so the
      # site and the release zip are then the same files rather than two builds that agree.
      - name: Build (Pages)
        if: needs.channel.outputs.channel == 'stable' && vars.PAGES_BASE != '/'
        run: npm run build
        env:
          SCMJS_BASE: ${{ vars.PAGES_BASE || format('/{0}/', github.event.repository.name) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        if: needs.channel.outputs.channel == 'stable'
        with:
          path: dist

  # `@scm-js/plugin-api` is the plugin API's declarations as one generated `index.d.ts`,
  # which plugin repositories take as a devDependency instead of each carrying a copy of
  # the emitted tree and refreshing it by hand. It goes to two places: the npm registry,
  # which is what they depend on (`^1`, `npm outdated`, `npm update`, and a page somebody
  # outside the organisation can find), and github.com/scm-js/plugin-api, which is the
  # audit trail behind the tarball and holds its README.
  #
  # The version is the *API's*, not the editor's — major is PLUGIN_API_VERSION and the
  # minor moves when the declarations do — so this runs on every build and does nothing at
  # all when `src/plugins/api.ts` has not moved. That is also why it does not depend on the
  # channel: a contract that moved on main is a contract plugin authors can have today.
  #
  # PLUGIN_API_PAT is an organisation secret — a token with Contents: write on
  # scm-js/plugin-api and nothing else — because a repository's own GITHUB_TOKEN cannot
  # write to another repository. Without it this reports what it would have done and stops:
  # the types being one build behind is not worth failing a release over.
  #
  # PUBLISH_PLUGIN_API is the repository variable that turns the npm half on. It is
  # separate because the tarball needs the @scm-js scope to exist and npm's trusted
  # publishing to be configured for it, and an npm version, once published, cannot be
  # taken back. `--provenance` comes from the `id-token: write` above, so the package page
  # names this workflow run and the commit it was built from; the same `id-token` is what
  # OIDC authenticates the publish with, so there is no npm token here at all.
  #
  # Which is why setup-node below is deliberately *not* given `registry-url`: that writes
  # an .npmrc holding `_authToken=${NODE_AUTH_TOKEN}` and `always-auth=true`, and with no
  # token secret set that is an **empty** credential for npm to present instead of
  # exchanging its OIDC one. The publish wants no .npmrc at all.
  #
  # The trusted publisher on npmjs.com must name this repository and `build.yml`, leave
  # Environment blank (this job declares none), and have **Allowed actions** set to permit
  # publishing *directly*: staging is always allowed, direct publish is opt-in and off by
  # default, and `publish-plugin-api.mjs` runs a direct `npm publish`. Without that a
  # correctly configured publisher still answers `403 OIDC permission denied for this
  # action` — which is about the action, not the identity. That cost an afternoon once.
  plugin-api:
    name: Plugin API types
    needs: [channel, web]
    if: needs.channel.outputs.channel != 'skip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_API_PAT }}
          TO_NPM: ${{ vars.PUBLISH_PLUGIN_API }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::PLUGIN_API_PAT is not set; reporting what would be published."
            node scripts/publish-plugin-api.mjs
            exit 0
          fi
          if [ "$TO_NPM" = "true" ]; then
            # Trusted publishing over OIDC needs npm 11.5.1 or newer, and the runner's
            # Node 22 ships npm 10.x — without this the publish falls back to looking for
            # a token that trusted publishing exists precisely so as not to have (and
            # that nothing here sets).
            npm install -g npm@latest
            npm --version
            node scripts/publish-plugin-api.mjs --push --npm
          else
            echo "::notice::the PUBLISH_PLUGIN_API variable is not 'true'; pushing the repository without publishing to npm."
            node scripts/publish-plugin-api.mjs --push
          fi

  pages:
    name: Deploy Pages
    needs: [channel, web]
    # editor.scmjs.dev is the newest tag, not main's HEAD: what the hosted editor is
    # running has a version number, release notes and an installer that matches it. Main
    # goes to nightly.editor.scmjs.dev below, once a night. `release.yml` dispatches this
    # workflow on the tag it writes, because a tag pushed with GITHUB_TOKEN starts no run.
    if: needs.channel.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  nightly-site:
    name: Nightly site
    needs: [channel, web]
    if: needs.channel.outputs.channel == 'nightly'
    runs-on: ubuntu-latest
    steps:
      # The zip the nightly release carries, unzipped — never rebuilt, so the hosted
      # nightly cannot differ from the one people download, exactly as the image job
      # takes the stable zip rather than building its own.
      - uses: actions/download-artifact@v4
        with:
          name: web-zip
      - run: unzip -q scmJS-web.zip -d site
      - name: Push to the nightly site repository
        env:
          # A fine-grained token with Contents: write on that repository and nothing else.
          # Without it this reports and stops: a fork should not fail its nightly over a
          # site it does not host.
          NIGHTLY_PAT: ${{ secrets.NIGHTLY_PAT }}
          DOMAIN: ${{ vars.NIGHTLY_DOMAIN }}
          VERSION: ${{ needs.channel.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${NIGHTLY_PAT:-}" ] || [ -z "${DOMAIN:-}" ]; then
            echo "::notice::NIGHTLY_PAT or NIGHTLY_DOMAIN is not set; the nightly site was not deployed."
            exit 0
          fi
          cd site
          # CNAME is where a branch-served Pages site keeps its custom domain, so it has
          # to be in every push or the domain is dropped. .nojekyll turns off the Jekyll
          # build a branch-served site otherwise gets: it would process the whole bundle
          # for nothing, and it drops files whose names begin with an underscore.
          printf '%s\n' "$DOMAIN" > CNAME
          touch .nojekyll
          # One orphan commit, force-pushed: the site is ~5 MB and there is nothing to
          # learn from its history, so the repository stays the size of one bundle rather
          # than growing by that much every night.
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "scmJS $VERSION (${GITHUB_SHA:0:7})"
          git push -qf "https://x-access-token:$NIGHTLY_PAT@github.com/${GITHUB_REPOSITORY_OWNER}/nightly" gh-pages
          echo "### Nightly site" >> "$GITHUB_STEP_SUMMARY"
          echo "https://$DOMAIN — scmJS $VERSION" >> "$GITHUB_STEP_SUMMARY"

  # docs.scmjs.dev: the repository's own guides (README.md, docs/*.md) rendered as pages,
  # and the plugin API reference generated from `plugin-api/index.d.ts` — the same bundled
  # declarations the `plugin-api` job publishes to npm. `scripts/build-docs.mjs` writes
  # both; nothing on the site is prose written by a generator, which is what keeps the
  # four documents `CLAUDE.md` names the only place any of it is maintained.
  #
  # Built on the **stable** channel only, and that is the point: the hosted editor, the
  # installers, the release notes and the documentation are one tag. Reading a page about
  # a dialog that will not exist for a fortnight is worse than reading one that is a
  # release behind, and "which version is this describing" then has an answer — the one in
  # the footer of every page. The exception to keep in mind is @scm-js/plugin-api, which
  # publishes from main: a plugin author on the newest package can be ahead of the
  # reference by one release. The API is additive, so what they see is a member missing
  # from these pages rather than one that behaves differently.
  #
  # Deployed the way the nightly site is: one force-pushed orphan commit on the gh-pages
  # branch of <owner>/docs, whose main branch keeps the repository's own README. DOCS_PAT
  # is a fine-grained token with Contents: write on that repository and nothing else, and
  # DOCS_DOMAIN the custom domain its CNAME carries. Without either this reports and
  # stops — a fork should not fail a release over a site it does not host.
  docs:
    name: Docs site
    needs: [channel, web]
    if: needs.channel.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm version --no-git-tag-version "${{ needs.channel.outputs.version }}"
      # `build:docs` bundles the declarations first, so the reference is this tag's
      # contract rather than whatever happens to be on disk.
      - name: Build
        env:
          DOMAIN: ${{ vars.DOCS_DOMAIN }}
        run: |
          set -euo pipefail
          npm run build:docs -- --out docs-site ${DOMAIN:+--domain "$DOMAIN"}
      - name: Push to the docs repository
        env:
          DOCS_PAT: ${{ secrets.DOCS_PAT }}
          DOMAIN: ${{ vars.DOCS_DOMAIN }}
          VERSION: ${{ needs.channel.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${DOCS_PAT:-}" ] || [ -z "${DOMAIN:-}" ]; then
            echo "::notice::DOCS_PAT or DOCS_DOMAIN is not set; the documentation site was not deployed."
            exit 0
          fi
          cd docs-site
          # As the nightly site: CNAME in every push or a branch-served Pages site loses
          # its domain, and .nojekyll so nothing is run over the output.
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "scmJS $VERSION docs (${GITHUB_SHA:0:7})"
          git push -qf "https://x-access-token:$DOCS_PAT@github.com/${GITHUB_REPOSITORY_OWNER}/docs" gh-pages
          echo "### Documentation" >> "$GITHUB_STEP_SUMMARY"
          echo "https://$DOMAIN — scmJS $VERSION" >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: channel
    if: needs.channel.outputs.channel == 'nightly' || needs.channel.outputs.channel == 'stable'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm version --no-git-tag-version "${{ needs.channel.outputs.version }}"
      # The first step of this is `scripts/vendor-plugins.mjs`, which fetches the default
      # plugins at the versions `src/plugins/defaults.ts` pins and writes them into
      # `plugins/` for the bundler: an installed application should not need the network
      # to have Repair check the map it just opened. The token is only to keep the one
      # file-list request per plugin off the anonymous rate limit runners share.
      - run: npm run build:desktop
        env:
          SCMJS_BASE: /
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No signing identity yet; without this electron-builder's discovery fails the macOS build.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          # latest*.yml is electron-updater's feed (a few hundred bytes) and the .blockmap
          # files are what let it download only the changed parts of an installer. Neither
          # is used yet; both are the whole preparation for in-app updates.
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  image:
    name: Container image
    needs: [channel, web]
    # Tagged releases only. A nightly is a thing you install and can roll back by keeping
    # the old installer; an image tagged `latest` in a registry is what someone's
    # `docker run` picks up without asking, so only a version that was cut on purpose
    # goes there. (`release.yml` builds and smoke-tests the same image before it tags, so
    # a broken Dockerfile stops the release rather than landing in the registry.)
    if: needs.channel.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The bundle the release itself carries — built, linted and tested by the `web` job.
      # Nothing is rebuilt here, so the image cannot differ from the zip.
      - uses: actions/download-artifact@v4
        with:
          name: web-zip
      - run: unzip -q scmJS-web.zip -d dist
      # No RUN step in the Dockerfile and static files inside it, so both architectures
      # come out of one build with no emulation. buildx is still what writes the manifest
      # list; QEMU is not needed.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # The full version, the moving `X.Y` and `X`, and `latest`. The semver patterns
          # read the tag this run is on. `v1.0.0-beta.1` takes the stable channel too, so
          # `latest` is written out here with its own condition rather than left to the
          # action's `latest=auto` flavour: a prerelease publishes an image under its own
          # version and nothing else, and `latest` keeps meaning the newest real release.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(needs.channel.outputs.version, '-') }}
          labels: |
            org.opencontainers.image.title=scmJS
            org.opencontainers.image.description=A StarCraft: Brood War map editor that runs in a browser tab.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
      - name: Summary
        run: |
          {
            echo "### Container image"
            echo
            echo '```sh'
            echo "docker run --rm -p 8080:80 ghcr.io/${{ github.repository }}:${{ needs.channel.outputs.version }}"
            echo '```'
            echo
            echo "Tags pushed:"
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/;s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release (${{ needs.channel.outputs.tag }})
    needs: [channel, web, desktop]
    if: needs.channel.outputs.channel == 'nightly' || needs.channel.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          # The web zip and the installers only — not the Pages artifact the web job also uploads.
          pattern: "{web-zip,desktop-*}"
          merge-multiple: true
      - run: ls -la assets
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.channel.outputs.channel }}
          TAG: ${{ needs.channel.outputs.tag }}
          VERSION: ${{ needs.channel.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == "stable" ]]; then
            # What a person wrote goes above what GitHub generates: the dispatch input if
            # the Release workflow was given one, else docs/releases/<version>.md out of
            # this tag's own tree (docs/releases/README.md). Neither is required — with
            # nothing written the release is the generated list alone, as it always was.
            file="docs/releases/$VERSION.md"
            args=(--title "scmJS $VERSION" --generate-notes --verify-tag)
            if [[ -n "${NOTES//[[:space:]]/}" ]]; then
              printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
              args+=(--notes-file "$RUNNER_TEMP/notes.md")
              echo "Notes: the dispatch input."
            elif [[ -s "$file" ]]; then
              args+=(--notes-file "$file")
              echo "Notes: $file."
            else
              echo "Notes: none written for $VERSION; the generated list alone."
            fi
            gh release create "$TAG" assets/* "${args[@]}"
            exit 0
          fi

          # One rolling prerelease, updated in place. Deleting and recreating it would
          # reset the download counts and re-notify everyone watching releases; only the
          # tag moves.
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
          # printf, not a multi-line string literal: this block is indented inside the
          # YAML, and the leading spaces would reach the notes and make GitHub render the
          # second paragraph as a code block.
          notes=$(printf '%s\n\n%s' \
            "Built from main at ${GITHUB_SHA:0:7} on $(date -u +%Y-%m-%d)." \
            "Replaced by the next nightly. For a version that stays put, take a numbered release.")
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly assets/* --clobber
            gh release edit nightly --title "Nightly ($VERSION)" --notes "$notes" --prerelease --latest=false
          else
            gh release create nightly assets/* \
              --title "Nightly ($VERSION)" --notes "$notes" --prerelease --latest=false
          fi
