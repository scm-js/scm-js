# Two channels, nothing else:
#
#   latest   every push to main — the web bundle deployed to GitHub Pages, and one rolling
#            prerelease named `latest` whose assets (installers for Windows, macOS, Linux
#            and a zip of the web bundle) are replaced each time
#   vX.Y.Z   a pushed tag — a proper release with the same assets, notes generated from
#            the commits since the previous tag
#
# The hosted web build gets its game-data address from the GAME_DATA_URL repository
# variable (Settings ▸ Variables) and its base path from PAGES_BASE (default: the
# repository name; set "/" for a custom domain). Desktop builds carry no address on
# purpose — they look on the user's disk and ask otherwise. Nothing here has, or needs,
# the game data: the real-data test suites skip in CI.
#
# Code signing: none yet. Windows shows SmartScreen's "unrecognized app" screen, and macOS
# refuses an unsigned app until the user runs `xattr -d com.apple.quarantine`; the Linux
# builds and the web build have no such friction.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  channel:
    name: Channel
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.pick.outputs.name }}
      version: ${{ steps.pick.outputs.version }}
      tagged: ${{ steps.pick.outputs.tagged }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            # The newest version tag, as a prerelease of it: 1.2.0-latest.20260902.abc1234
            last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
            echo "name=latest" >> "$GITHUB_OUTPUT"
            echo "version=${last#v}-latest.$(date -u +%Y%m%d).$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

  web:
    name: Web
    needs: channel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm version --no-git-tag-version "${{ needs.channel.outputs.version }}"
      - run: npm run lint
      - run: npm test
      # The bundle that goes on the release: served from the root of wherever it is put.
      - name: Build (release zip)
        run: npm run build
        env:
          SCMJS_BASE: /
          VITE_GAME_DATA_URL: ${{ vars.GAME_DATA_URL }}
      - run: cd dist && zip -qr "../scmjs-web-${{ needs.channel.outputs.version }}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: scmjs-web-*.zip
          if-no-files-found: error
      # The same, under the path GitHub Pages serves this repository from.
      - name: Build (Pages)
        if: needs.channel.outputs.tagged == 'false'
        run: npm run build
        env:
          SCMJS_BASE: ${{ vars.PAGES_BASE || format('/{0}/', github.event.repository.name) }}
          VITE_GAME_DATA_URL: ${{ vars.GAME_DATA_URL }}
      - uses: actions/upload-pages-artifact@v3
        if: needs.channel.outputs.tagged == 'false'
        with:
          path: dist

  pages:
    name: Deploy Pages
    needs: [channel, web]
    if: needs.channel.outputs.tagged == 'false' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: channel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm version --no-git-tag-version "${{ needs.channel.outputs.version }}"
      - run: npm run build:desktop
        env:
          SCMJS_BASE: /
          # No signing identity yet; without this electron-builder's discovery fails the macOS build.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    name: Release (${{ needs.channel.outputs.name }})
    needs: [channel, web, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: ls -la assets
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.channel.outputs.name }}
          VERSION: ${{ needs.channel.outputs.version }}
          TAGGED: ${{ needs.channel.outputs.tagged }}
        run: |
          set -euo pipefail
          if [[ "$TAGGED" == "true" ]]; then
            gh release create "$NAME" assets/* \
              --title "scmJS $VERSION" \
              --generate-notes \
              --verify-tag
          else
            # One rolling prerelease: recreate it on the current commit so old assets do not pile up.
            gh release delete latest --yes --cleanup-tag || true
            git tag -f latest "$GITHUB_SHA"
            git push -f origin refs/tags/latest
            gh release create latest assets/* \
              --title "Latest ($VERSION)" \
              --prerelease \
              --notes "Built from main at ${GITHUB_SHA:0:7}. Replaced on every push; for a fixed version take a numbered release."
          fi
