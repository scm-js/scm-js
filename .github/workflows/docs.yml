# docs.scmjs.dev: `npm run build:docs`, force-pushed as one orphan commit onto
# scm-js/docs's `gh-pages` branch.
#
# Two ways in:
#
#   a release   build.yml's `docs` job calls this on the tag, with the tag's version, so
#               the site, the hosted editor and the installers are one version.
#   by hand     Actions ▸ Docs site ▸ Run workflow, from main by default: a fix to the
#               guides goes live without cutting a release. The footer then reads
#               "0.6.0 + main@abc1234", the release the pages follow and the commit they
#               were built from. Whatever is on that ref goes out, including the prose
#               for a feature not yet released and the plugin API reference as main
#               declares it; the next release's run replaces it with the tag's own.
#
# Needs the DOCS_PAT secret (write access to scm-js/docs) and the DOCS_DOMAIN variable;
# without them it builds, says so, and deploys nothing.

name: Docs site

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build the pages from
        type: string
        default: main
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      version:
        description: What the footer calls the build. Blank works it out from the newest release tag and the commit.
        type: string
        default: ""

permissions:
  contents: read

# A release and a hand run pushing at once would each force-push; one at a time, in order.
concurrency:
  group: docs-site
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  docs:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # The newest release tag names what a hand-run build follows.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Version
        id: version
        env:
          GIVEN: ${{ inputs.version }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "${GIVEN:-}" ]; then
            echo "version=$GIVEN" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          release=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          release=${release#v}
          sha=$(git rev-parse --short=7 HEAD)
          if [ -n "$release" ] && [ "$(git rev-parse HEAD)" = "$(git rev-parse "v$release^{commit}")" ]; then
            echo "version=$release" >> "$GITHUB_OUTPUT"
          else
            echo "version=${release:-unreleased} + ${REF}@$sha" >> "$GITHUB_OUTPUT"
          fi
      # `build:docs` bundles the declarations first, so the reference is this ref's
      # contract rather than whatever happens to be on disk.
      - name: Build
        env:
          DOMAIN: ${{ vars.DOCS_DOMAIN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm run build:docs -- --out docs-site --version "$VERSION" ${DOMAIN:+--domain "$DOMAIN"}
      - name: Push to the docs repository
        env:
          DOCS_PAT: ${{ secrets.DOCS_PAT }}
          DOMAIN: ${{ vars.DOCS_DOMAIN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${DOCS_PAT:-}" ] || [ -z "${DOMAIN:-}" ]; then
            echo "::notice::DOCS_PAT or DOCS_DOMAIN is not set; the documentation site was not deployed."
            exit 0
          fi
          cd docs-site
          # As the nightly site: CNAME in every push or a branch-served Pages site loses
          # its domain, and .nojekyll so nothing is run over the output.
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "scmJS $VERSION docs ($SHA)"
          git push -qf "https://x-access-token:$DOCS_PAT@github.com/${GITHUB_REPOSITORY_OWNER}/docs" gh-pages
          echo "### Documentation" >> "$GITHUB_STEP_SUMMARY"
          echo "https://$DOMAIN — scmJS $VERSION" >> "$GITHUB_STEP_SUMMARY"
