# Serves the built bundle. One page, no API, no state on the server: everything the editor
# keeps lives in the browser it is opened from.
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # The tileset and unit files have no registered media type; they are read as bytes.
    default_type application/octet-stream;

    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json application/wasm image/svg+xml;

    # Vite's assets carry a content hash, so a name never means two things.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Where the editor looks for the game data bundled with a build
    # (src/gamedata/source.ts, step 1). Nothing ships at these paths — Blizzard's files
    # are not redistributable — so by default every one of them 404s and the editor asks
    # through Help ▸ Game Data… like the hosted build does. Mount an extracted tree over
    # them to serve your own:
    #
    #   -v /path/to/scm-js/public/tileset:/usr/share/nginx/html/tileset:ro
    #
    # A miss has to be a real 404 rather than the fallback below: the manifest probe reads
    # a 200 that is not JSON as "nothing here", but only because index.html is what a dev
    # server answers with, and there is no reason to make this one lie too.
    location ~ ^/(tileset|arr|unit|game|scripts)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The one file that must not be cached: it names the hashed assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The editor's own deep links are query strings (`/?layer=units&dialog=…`), so this
    # only catches a path someone typed or a stale bookmark.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
