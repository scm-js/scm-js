<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" width="760" height="286" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">One doodad in four sections</title>
<desc id="d">A doodad three tiles wide and two high. TILE keeps the ground under it, MTXM has its tiles drawn in, DD2 records its number and middle for an editor to select, and THG2 holds its sprite if it has one. The game reads MTXM and THG2; only editors read TILE and DD2.</desc>
