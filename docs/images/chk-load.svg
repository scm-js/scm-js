<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 574" width="760" height="574" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">How StarCraft opens a map</title>
<desc id="d">StarCraft lists the sections of scenario.chk, then reads the map up to three times. The map list read needs VER, DIM, ERA, OWNR, SIDE, STR, SPRP, FORC and VCOD, and shows Invalid Scenario if one fails. The start of a game needs STR, MTXM, THG2 and UNIT (and COLR in a Brood War file), and Use Map Settings also needs MASK, the settings tables, PUNI, UPRP, MRGN and TRIG; a failure stops the game with Error loading scenario file. The briefing reads STR and MBRF, and a failure only means no briefing.</desc>
<rect width="760" height="574" rx="10" fill="#12151b"/>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker></defs>
<text x="24" y="30" font-size="15" fill="#e6e8ee" text-anchor="start" font-weight="600">How StarCraft opens a map</text>
<rect x="24" y="50" width="150" height="34" rx="5" fill="#191d25" stroke="#4b5363" stroke-width="1.2"/><text x="99" y="71.32" font-size="12" fill="#e6e8ee" text-anchor="middle">the map's .scm / .scx</text>
<line x1="176" y1="67" x2="214" y2="67" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<rect x="216" y="50" width="168" height="34" rx="5" fill="#191d25" stroke="#4b5363" stroke-width="1.2"/><text x="300" y="71.32" font-size="12" fill="#e6e8ee" text-anchor="middle">staredit\scenario.chk</text>
<line x1="386" y1="67" x2="424" y2="67" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<rect x="426" y="50" width="310" height="34" rx="5" fill="#191d25" stroke="#4b5363" stroke-width="1.2"/><text x="581" y="71.32" font-size="12" fill="#e6e8ee" text-anchor="middle">a list of every section, in file order</text>
<text x="24" y="106" font-size="12" fill="#9aa3b2" text-anchor="start">Before each read the game checks VER: it must be 59, 63 or 205, and 205 needs Brood War.</text>
<rect x="16" y="126" width="564" height="88" rx="8" fill="#161a21" stroke="#232834"/>
<text x="28" y="148" font-size="13.5" fill="#e6e8ee" text-anchor="start" font-weight="600">1  The map list</text>
<text x="28" y="166" font-size="11.5" fill="#9aa3b2" text-anchor="start">Whenever the list shows the map, when a game is made with it, and again at the start.</text>
<rect x="28" y="178" width="44" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="50" y="194.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">VER</text><rect x="76" y="178" width="44" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="98" y="194.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">DIM</text><rect x="124" y="178" width="44" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="146" y="194.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">ERA</text><rect x="172" y="178" width="44" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="194" y="194.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">OWNR</text><rect x="220" y="178" width="44" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="242" y="194.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">SIDE</text><rect x="268" y="178" width="44" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="290" y="194.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">STR</text><rect x="316" y="178" width="44" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="338" y="194.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">SPRP</text><rect x="364" y="178" width="44" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="386" y="194.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">FORC</text><rect x="412" y="178" width="44" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="434" y="194.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">VCOD</text>
<rect x="592" y="136" width="144" height="68" rx="6" fill="#3a2024" stroke="#d0605a" stroke-width="1.3"/>
<text x="664" y="156" font-size="12" fill="#f2b8b4" text-anchor="middle" font-weight="600">Invalid Scenario</text>
<text x="664" y="173" font-size="10.5" fill="#9aa3b2" text-anchor="middle">the map is listed but</text>
<text x="664" y="187" font-size="10.5" fill="#9aa3b2" text-anchor="middle">cannot be chosen</text>
<line x1="580" y1="170" x2="590" y2="170" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<rect x="16" y="230" width="564" height="160" rx="8" fill="#161a21" stroke="#232834"/>
<text x="28" y="252" font-size="13.5" fill="#e6e8ee" text-anchor="start" font-weight="600">2  The start of a game</text>
<text x="28" y="270" font-size="11.5" fill="#9aa3b2" text-anchor="start">The game type decides the list: Use Map Settings reads far more than melee does.</text>
<text x="28" y="294" font-size="11.5" fill="#e6e8ee" text-anchor="start">Melee, and every other type but Use Map Settings</text>
<rect x="28" y="302" width="38" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="47" y="318.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">STR</text><rect x="70" y="302" width="38" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="89" y="318.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">MTXM</text><rect x="112" y="302" width="38" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="131" y="318.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">THG2</text><rect x="154" y="302" width="38" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="173" y="318.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">UNIT</text><rect x="196" y="302" width="52" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="222" y="318.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">COLR*</text>
<text x="28" y="348" font-size="11.5" fill="#e6e8ee" text-anchor="start">Use Map Settings</text>
<rect x="28" y="356" width="38" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="47" y="372.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">STR</text><rect x="70" y="356" width="38" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="89" y="372.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">MTXM</text><rect x="112" y="356" width="38" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="131" y="372.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">THG2</text><rect x="154" y="356" width="38" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="173" y="372.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">MASK</text><rect x="196" y="356" width="116" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="254" y="372.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">5 settings tables</text><rect x="316" y="356" width="38" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="335" y="372.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">PUNI</text><rect x="358" y="356" width="38" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="377" y="372.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">UNIT</text><rect x="400" y="356" width="38" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="419" y="372.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">UPRP</text><rect x="442" y="356" width="38" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="461" y="372.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">MRGN</text><rect x="484" y="356" width="38" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="503" y="372.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">TRIG</text><rect x="526" y="356" width="52" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="552" y="372.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">COLR*</text>
<rect x="592" y="266" width="144" height="88" rx="6" fill="#3a2024" stroke="#d0605a" stroke-width="1.3"/>
<text x="664" y="286" font-size="12" fill="#f2b8b4" text-anchor="middle" font-weight="600">Error loading</text>
<text x="664" y="301" font-size="12" fill="#f2b8b4" text-anchor="middle" font-weight="600">scenario file.</text>
<text x="664" y="318" font-size="10.5" fill="#9aa3b2" text-anchor="middle">the game stops</text>
<text x="664" y="332" font-size="10.5" fill="#9aa3b2" text-anchor="middle">before it begins</text>
<line x1="580" y1="310" x2="590" y2="310" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<rect x="16" y="406" width="564" height="88" rx="8" fill="#161a21" stroke="#232834"/>
<text x="28" y="428" font-size="13.5" fill="#e6e8ee" text-anchor="start" font-weight="600">3  The briefing</text>
<text x="28" y="446" font-size="11.5" fill="#9aa3b2" text-anchor="start">Use Map Settings only, when the briefing room opens.</text>
<rect x="28" y="458" width="44" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="50" y="474.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">STR</text><rect x="76" y="458" width="44" height="24" rx="5" fill="#23324a" stroke="#3c5a86" stroke-width="1.2"/><text x="98" y="474.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle" font-weight="600">MBRF</text>
<rect x="592" y="416" width="144" height="68" rx="6" fill="#191d25" stroke="#4b5363" stroke-width="1.3"/>
<text x="664" y="436" font-size="12" fill="#e6e8ee" text-anchor="middle" font-weight="600">No briefing</text>
<text x="664" y="453" font-size="10.5" fill="#9aa3b2" text-anchor="middle">the game goes on</text>
<text x="664" y="467" font-size="10.5" fill="#9aa3b2" text-anchor="middle">as if it had none</text>
<line x1="580" y1="450" x2="590" y2="450" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="324" y1="216" x2="324" y2="228" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="324" y1="392" x2="324" y2="404" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<text x="24" y="518" font-size="11.5" fill="#9aa3b2" text-anchor="start">Each read needs every section it shows. * COLR only in a Brood War file (VER 205). The settings tables are UNIx, UPGx,</text><text x="24" y="534" font-size="11.5" fill="#9aa3b2" text-anchor="start">TECx, PUPx and PTEx in a Brood War file; an older file has UNIS, UPGS, TECS, UPGR and PTEC, with the Brood War ones</text><text x="24" y="550" font-size="11.5" fill="#9aa3b2" text-anchor="start">read on top when present. A read fails at the first missing section or the first copy of a section it does not accept.</text>
</svg>
