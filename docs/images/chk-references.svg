<text x="154" y="277" font-size="12" fill="#9aa3b2" text-anchor="middle">location</text>
<text x="124" y="354" font-size="12" fill="#9aa3b2" text-anchor="middle">properties slot</text>
<text x="324" y="368" font-size="12" fill="#9aa3b2" text-anchor="middle">in use</text>
<rect x="524" y="268" width="80" height="30" rx="6" fill="#191d25" stroke="#4b5363" stroke-width="1.2"/><text x="564" y="288" font-size="13" fill="#e6e8ee" text-anchor="middle" font-weight="600">UNIT</text>
<path d="M604,276 C644,256 644,306 606,292" fill="none" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<text x="524" y="318" font-size="12" fill="#9aa3b2" text-anchor="start">serial numbers: add-ons,</text>
<text x="524" y="334" font-size="12" fill="#9aa3b2" text-anchor="start">nydus canals</text>
