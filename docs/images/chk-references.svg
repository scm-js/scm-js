<rect x="194" y="514" width="70" height="30" rx="6" fill="#191d25" stroke="#4b5363" stroke-width="1.2"/><text x="229" y="534" font-size="13" fill="#e6e8ee" text-anchor="middle" font-weight="600">MASK</text>
<rect x="194" y="556" width="70" height="30" rx="6" fill="#191d25" stroke="#4b5363" stroke-width="1.2"/><text x="229" y="576" font-size="13" fill="#e6e8ee" text-anchor="middle" font-weight="600">ISOM</text>
<rect x="194" y="598" width="70" height="30" rx="6" fill="#191d25" stroke="#4b5363" stroke-width="1.2"/><text x="229" y="618" font-size="13" fill="#e6e8ee" text-anchor="middle" font-weight="600">DD2</text>
