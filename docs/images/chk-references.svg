<line x1="239" y1="80" x2="347" y2="138" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<rect x="288" y="50" width="78" height="30" rx="6" fill="#191d25" stroke="#4b5363" stroke-width="1.2"/><text x="327" y="70" font-size="13" fill="#e6e8ee" text-anchor="middle" font-weight="600">UNIx</text>
<line x1="327" y1="80" x2="363" y2="138" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
