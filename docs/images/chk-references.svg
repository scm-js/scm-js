<text x="24" y="200" font-size="12" fill="#9aa3b2" text-anchor="start">UNIS names units the way UNIx does. Only editors read SWNM and WAV.</text>
<text x="24" y="246" font-size="14" fill="#e6e8ee" text-anchor="start" font-weight="600">Other numbers a record stores</text>
