<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 652" width="760" height="652" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">How the sections refer to each other</title>
<desc id="d">String numbers in eight sections point into the string table. Triggers point at locations and unit properties slots, units at each other by serial number. DIM sets the size of the terrain and fog sections and ERA the meaning of their numbers; VER picks the settings tables.</desc>
