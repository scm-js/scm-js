<line x1="503" y1="80" x2="395" y2="138" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<rect x="552" y="50" width="78" height="30" rx="6" fill="#191d25" stroke="#4b5363" stroke-width="1.2"/><text x="591" y="70" font-size="13" fill="#e6e8ee" text-anchor="middle" font-weight="600">TRIG</text>
<line x1="591" y1="80" x2="411" y2="138" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
