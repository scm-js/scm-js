<text x="24" y="30" font-size="14" fill="#e6e8ee" text-anchor="start" font-weight="600">String numbers point into the string table</text>
<rect x="24" y="50" width="78" height="30" rx="6" fill="#191d25" stroke="#4b5363" stroke-width="1.2"/><text x="63" y="70" font-size="13" fill="#e6e8ee" text-anchor="middle" font-weight="600">SPRP</text>
