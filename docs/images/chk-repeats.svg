<g><rect x="194" y="70" width="150" height="46" rx="5" fill="#191d25" stroke="#4b5363"/><rect x="194" y="70" width="150" height="16" rx="5" fill="#2b313e"/><text x="202" y="82" font-size="11" fill="#e6e8ee" text-anchor="start" font-weight="600">DIM  (second copy)</text><text x="269" y="104" font-size="13" fill="#e7c160" text-anchor="middle">128 × 96</text></g>
<line x1="354" y1="93" x2="388" y2="93" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<rect x="400" y="70" width="150" height="46" rx="5" fill="#191d25" stroke="#e7c160" stroke-width="1.5"/>
<text x="475" y="98" font-size="13" fill="#e7c160" text-anchor="middle" font-weight="600">128 × 96</text>
<text x="566" y="90" font-size="12" fill="#e6e8ee" text-anchor="start">The first copy</text>
<text x="566" y="106" font-size="12" fill="#e6e8ee" text-anchor="start">is ignored.</text>
<text x="24" y="140" font-size="11" fill="#9aa3b2" text-anchor="start">Most sections: TYPE, VER, IVER, IVE2, VCOD, IOWN, OWNR, ERA and the rest.</text>
<text x="24" y="182" font-size="14" fill="#e6e8ee" text-anchor="start" font-weight="600">Every copy is written over the same space</text>
