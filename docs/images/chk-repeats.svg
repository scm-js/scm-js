<text x="560" y="214" font-size="12" fill="#e6e8ee" text-anchor="start">The second copy rewrites</text>
<text x="560" y="230" font-size="12" fill="#e6e8ee" text-anchor="start">only the tiles it has bytes</text>
<text x="560" y="246" font-size="12" fill="#e6e8ee" text-anchor="start">for: the top half. The rest</text>
<text x="560" y="262" font-size="12" fill="#e6e8ee" text-anchor="start">is what the first copy left.</text>
<text x="24" y="296" font-size="11" fill="#9aa3b2" text-anchor="start">Sections: MTXM, ISOM, TILE, MASK, MRGN.</text>
<text x="24" y="334" font-size="14" fill="#e6e8ee" text-anchor="start" font-weight="600">Every copy counts</text>
