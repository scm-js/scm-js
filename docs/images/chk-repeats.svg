<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker></defs>
<text x="24" y="28" font-size="12" fill="#9aa3b2" text-anchor="start">In the file</text>
<text x="400" y="28" font-size="12" fill="#9aa3b2" text-anchor="start">What the game has</text>
<text x="24" y="58" font-size="14" fill="#e6e8ee" text-anchor="start" font-weight="600">Only the last copy counts</text>
