<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 432" width="760" height="432" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">What the game does with a second copy of a section</title>
<desc id="d">Three ways the game combines repeated sections. For most, only the last copy counts. For the terrain, fog and location sections, each copy is written over the start of the same space, so a half-length second MTXM rewrites the top half of the map. For units, sprites, doodads, triggers and briefings, the records of every copy make one list.</desc>
