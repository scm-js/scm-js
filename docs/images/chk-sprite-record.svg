<text x="310.8" y="57" font-size="10" fill="#9aa3b2" text-anchor="start">4</text>
<text x="380" y="83" font-size="11" fill="#e6e8ee" text-anchor="middle">y</text>
<rect x="451.2" y="62" width="69.7" height="34" fill="#44331f" stroke="#4b5363"/>
<text x="453.2" y="57" font-size="10" fill="#9aa3b2" text-anchor="start">6</text>
