<text x="26" y="57" font-size="10" fill="#9aa3b2" text-anchor="start">0</text>
<text x="95.2" y="83" font-size="11" fill="#e6e8ee" text-anchor="middle">sprite or unit type</text>
<rect x="166.4" y="62" width="140.9" height="34" fill="#35294a" stroke="#4b5363"/>
<text x="168.4" y="57" font-size="10" fill="#9aa3b2" text-anchor="start">2</text>
<text x="237.6" y="83" font-size="11" fill="#e6e8ee" text-anchor="middle">x</text>
