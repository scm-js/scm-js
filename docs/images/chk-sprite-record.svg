<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 122" width="760" height="122" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">A sprite, byte by byte</title>
<desc id="d">The 10-byte THG2 record drawn to scale, each field at its offset.</desc>
<rect width="760" height="122" rx="10" fill="#12151b"/>
