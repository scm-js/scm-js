<rect x="414" y="64" width="319" height="40" fill="#23324a" stroke="#4b5363"/>
<text x="498" y="89" font-size="11" fill="#e6e8ee" text-anchor="start">16 megatile numbers, one per variation</text>
<text x="224" y="120" font-size="10" fill="#9aa3b2" text-anchor="middle">type</text>
