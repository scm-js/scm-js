<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" width="760" height="416" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">From a tile number to pixels</title>
<desc id="d">Tile number 0x0132 is tile group 19, variation 2. CV5 record 19 gives the megatile for variation 2; the VX4 megatile lists sixteen minitile references; each VR4 minitile is 64 palette indices; the WPE palette gives each index its colour.</desc>
<rect width="760" height="416" rx="10" fill="#12151b"/>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker></defs>
<text x="24" y="30" font-size="15" fill="#e6e8ee" text-anchor="start" font-weight="600">From a tile number to pixels</text>
<text x="24" y="56" font-size="12" fill="#9aa3b2" text-anchor="start">MTXM, one tile</text>
<rect x="24" y="64" width="120" height="40" rx="6" fill="#2b313e" stroke="#e7c160" stroke-width="1.5"/>
<text x="84" y="90" font-size="16" fill="#e6e8ee" text-anchor="middle" font-weight="600">0x0132</text>
<text x="24" y="128" font-size="12" fill="#e6e8ee" text-anchor="start">÷ 16 → group 19</text>
<text x="24" y="146" font-size="12" fill="#e6e8ee" text-anchor="start">remainder → variation 2</text>
<text x="214" y="56" font-size="12" fill="#9aa3b2" text-anchor="start">CV5, record 19 (52 bytes)</text>
