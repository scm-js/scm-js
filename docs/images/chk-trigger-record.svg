<text x="26" y="129" font-size="10" fill="#9aa3b2" text-anchor="start">2368</text>
<text x="68.5" y="155" font-size="11" fill="#e6e8ee" text-anchor="middle">flags</text>
<rect x="113" y="134" width="599.25" height="34" fill="#35294a" stroke="#4b5363"/>
<text x="115" y="129" font-size="10" fill="#9aa3b2" text-anchor="start">2372</text>
<text x="413.38" y="155" font-size="11" fill="#e6e8ee" text-anchor="middle">players and groups, one byte each</text>
<rect x="713.75" y="134" width="20.75" height="34" fill="#26402f" stroke="#4b5363"/>
