<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 548" width="760" height="548" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">The trigger record, byte by byte</title>
<desc id="d">A trigger is 2400 bytes: 16 conditions of 20 bytes, 64 actions of 32 bytes, 4 bytes of flags, 27 bytes saying which players and groups it runs for, and one byte the game uses while it runs. Below, where each field of a condition and an action is.</desc>
<rect width="760" height="548" rx="10" fill="#12151b"/>
<text x="24" y="30" font-size="15" fill="#e6e8ee" text-anchor="start" font-weight="600">A trigger, 2400 bytes</text>
