<text x="120.93" y="53" font-size="10" fill="#9aa3b2" text-anchor="start">320</text>
<text x="422.72" y="79" font-size="11.5" fill="#e6e8ee" text-anchor="middle">64 actions × 32 bytes</text>
<rect x="726.51" y="58" width="7.99" height="34" fill="#e7c160" stroke="#4b5363"/>
<text x="728.51" y="53" font-size="10" fill="#9aa3b2" text-anchor="start">2368</text>
