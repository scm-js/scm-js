<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">What the game does with a placed unit</title>
<desc id="d">The checks a UNIT record passes when a game starts: start locations are noted, not made; units of empty player slots are dropped; melee keeps only Player 12 minerals, geysers and critters; in Use Map Settings a User Selectable player keeps only neutral kinds of unit; Brood War units are not made in the original game; a ground unit touching ground it cannot walk on is removed with a warning, while a unit on top of another is moved aside and buildings are always made. Then the unit is made and its fields applied.</desc>
<rect width="760" height="590" rx="10" fill="#12151b"/>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker></defs>
<text x="24" y="30" font-size="15" fill="#e6e8ee" text-anchor="start" font-weight="600">What the game does with a placed unit</text>
<rect x="24" y="52" width="300" height="40" rx="6" fill="#2b313e" stroke="#4b5363"/>
<text x="36" y="76" font-size="12" fill="#e6e8ee" text-anchor="start">Is it a start location?</text>
<line x1="326" y1="72" x2="376" y2="72" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<text x="352" y="67" font-size="10.5" fill="#9aa3b2" text-anchor="middle">yes</text>
<rect x="380" y="52" width="356" height="40" rx="6" fill="#23324a" stroke="#3c5a86"/>
<text x="390" y="68.5" font-size="11.5" fill="#e6e8ee" text-anchor="start">No unit is made: its place becomes the owner's start</text>
<text x="390" y="83.5" font-size="11.5" fill="#e6e8ee" text-anchor="start">location.</text>
<line x1="64" y1="94" x2="64" y2="108" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<text x="74" y="105" font-size="10.5" fill="#9aa3b2" text-anchor="start">no</text>
<rect x="24" y="110" width="300" height="40" rx="6" fill="#2b313e" stroke="#4b5363"/>
<text x="36" y="126.5" font-size="12" fill="#e6e8ee" text-anchor="start">Is the owner Player 1 to 8, and is</text>
<text x="36" y="141.5" font-size="12" fill="#e6e8ee" text-anchor="start">that slot empty in this game?</text>
<line x1="326" y1="130" x2="376" y2="130" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<text x="352" y="125" font-size="10.5" fill="#9aa3b2" text-anchor="middle">yes</text>
<rect x="380" y="110" width="356" height="40" rx="6" fill="#3a2024" stroke="#6a3a3a"/>
<text x="390" y="134" font-size="11.5" fill="#e6e8ee" text-anchor="start">Dropped.</text>
<line x1="64" y1="152" x2="64" y2="166" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<text x="74" y="163" font-size="10.5" fill="#9aa3b2" text-anchor="start">no</text>
<rect x="24" y="168" width="300" height="40" rx="6" fill="#2b313e" stroke="#4b5363"/>
<text x="36" y="184.5" font-size="12" fill="#e6e8ee" text-anchor="start">Is this melee, or any type but</text>
<text x="36" y="199.5" font-size="12" fill="#e6e8ee" text-anchor="start">Use Map Settings?</text>
<line x1="326" y1="188" x2="376" y2="188" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<text x="352" y="183" font-size="10.5" fill="#9aa3b2" text-anchor="middle">yes</text>
<rect x="380" y="168" width="356" height="40" rx="6" fill="#3a2024" stroke="#6a3a3a"/>
<text x="390" y="184.5" font-size="11.5" fill="#e6e8ee" text-anchor="start">Kept only if it is a Player 12 mineral field, geyser</text>
<text x="390" y="199.5" font-size="11.5" fill="#e6e8ee" text-anchor="start">or critter.</text>
<line x1="64" y1="210" x2="64" y2="224" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<text x="74" y="221" font-size="10.5" fill="#9aa3b2" text-anchor="start">no</text>
<rect x="24" y="226" width="300" height="56" rx="6" fill="#2b313e" stroke="#4b5363"/>
<text x="36" y="250.5" font-size="12" fill="#e6e8ee" text-anchor="start">Use Map Settings, with the owner's race</text>
<text x="36" y="265.5" font-size="12" fill="#e6e8ee" text-anchor="start">set to User Selectable?</text>
<line x1="326" y1="254" x2="376" y2="254" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<text x="352" y="249" font-size="10.5" fill="#9aa3b2" text-anchor="middle">yes</text>
<rect x="380" y="226" width="356" height="56" rx="6" fill="#3a2024" stroke="#6a3a3a"/>
<text x="390" y="243" font-size="11.5" fill="#e6e8ee" text-anchor="start">Kept only if it is a neutral kind: a mineral field,</text>
<text x="390" y="258" font-size="11.5" fill="#e6e8ee" text-anchor="start">geyser, critter, power-up, door or trap, or a Map</text>
<text x="390" y="273" font-size="11.5" fill="#e6e8ee" text-anchor="start">Revealer, Dark Swarm or Disruption Web.</text>
<line x1="64" y1="284" x2="64" y2="298" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<text x="74" y="295" font-size="10.5" fill="#9aa3b2" text-anchor="start">no</text>
<rect x="24" y="300" width="300" height="40" rx="6" fill="#2b313e" stroke="#4b5363"/>
<text x="36" y="316.5" font-size="12" fill="#e6e8ee" text-anchor="start">A Brood War unit, in a game of</text>
<text x="36" y="331.5" font-size="12" fill="#e6e8ee" text-anchor="start">the original StarCraft?</text>
<line x1="326" y1="320" x2="376" y2="320" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<text x="352" y="315" font-size="10.5" fill="#9aa3b2" text-anchor="middle">yes</text>
<rect x="380" y="300" width="356" height="40" rx="6" fill="#3a2024" stroke="#6a3a3a"/>
<text x="390" y="324" font-size="11.5" fill="#e6e8ee" text-anchor="start">Not made.</text>
<line x1="64" y1="342" x2="64" y2="356" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<text x="74" y="353" font-size="10.5" fill="#9aa3b2" text-anchor="start">no</text>
<rect x="24" y="358" width="300" height="40" rx="6" fill="#2b313e" stroke="#4b5363"/>
<text x="36" y="374.5" font-size="12" fill="#e6e8ee" text-anchor="start">A ground unit whose footprint touches</text>
<text x="36" y="389.5" font-size="12" fill="#e6e8ee" text-anchor="start">ground it cannot walk on?</text>
<line x1="326" y1="378" x2="376" y2="378" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<text x="352" y="373" font-size="10.5" fill="#9aa3b2" text-anchor="middle">yes</text>
<rect x="380" y="358" width="356" height="40" rx="6" fill="#3a2024" stroke="#6a3a3a"/>
<text x="390" y="382" font-size="11.5" fill="#e6e8ee" text-anchor="start">Removed, with WARNING: Unit unplaceable! on screen.</text>
<line x1="64" y1="400" x2="64" y2="414" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<text x="74" y="411" font-size="10.5" fill="#9aa3b2" text-anchor="start">no</text>
<rect x="24" y="416" width="712" height="58" rx="6" fill="#1d2a20" stroke="#6fbf73"/>
<text x="36" y="438" font-size="12" fill="#e6e8ee" text-anchor="start">The unit is made, then the record's fields are applied, each only when its bit is set:</text>
<text x="36" y="458" font-size="11.5" fill="#9aa3b2" text-anchor="start">hit points, shields, energy, resources, hangar, and the states: cloaked, burrowed, lifted off, hallucinated, invincible.</text>
<text x="24" y="502" font-size="11.5" fill="#9aa3b2" text-anchor="start">A unit standing on another is moved aside to the nearest free spot. Buildings are made where the record puts them,</text><text x="24" y="518" font-size="11.5" fill="#9aa3b2" text-anchor="start">on any ground. Only the last UNIT section's start locations count. Hit points of 0% leave the unit at 1/256 of a hit</text><text x="24" y="534" font-size="11.5" fill="#9aa3b2" text-anchor="start">point. Resources are kept to 16 bits, so 70,000 becomes 4,464. Only Carriers, Reavers and their heroes take a hangar</text><text x="24" y="550" font-size="11.5" fill="#9aa3b2" text-anchor="start">count. A Ghost placed cloaked starts cloaked only if its owner has Personal Cloaking. Add-ons and nydus canals link</text><text x="24" y="566" font-size="11.5" fill="#9aa3b2" text-anchor="start">within one UNIT section.</text>
</svg>
