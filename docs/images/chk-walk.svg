<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">How the game finds the sections</title>
<desc id="d">Each section is an 8-byte header, a name and a length, followed by its data, and the next header comes straight after. A name the game does not know is passed over. A negative length jumps backwards, so the game reads bytes again as new headers. A length past the end of the file stops the walk; the section is kept and refuses the map only if a read needs it.</desc>
<rect width="760" height="470" rx="10" fill="#12151b"/>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker></defs>
<text x="24" y="30" font-size="15" fill="#e6e8ee" text-anchor="start" font-weight="600">How the game finds the sections</text>
<text x="24" y="58" font-size="12.5" fill="#e6e8ee" text-anchor="start">Each header gives the length of what follows, and the next header comes straight after it</text>
<g><rect x="24" y="110" width="57.6" height="30" fill="#2b313e" stroke="#4b5363"/><text x="52.8" y="123" font-size="11" fill="#e6e8ee" text-anchor="middle" font-weight="600">VER</text><text x="52.8" y="135" font-size="10" fill="#9aa3b2" text-anchor="middle">2</text><rect x="81.6" y="110" width="14.4" height="30" fill="#23324a" stroke="#4b5363"/></g>
<g><rect x="96" y="110" width="57.6" height="30" fill="#2b313e" stroke="#4b5363"/><text x="124.8" y="123" font-size="11" fill="#e6e8ee" text-anchor="middle" font-weight="600">DIM</text><text x="124.8" y="135" font-size="10" fill="#9aa3b2" text-anchor="middle">4</text><rect x="153.6" y="110" width="28.8" height="30" fill="#23324a" stroke="#4b5363"/></g>
<g><rect x="182.4" y="110" width="57.6" height="30" fill="#2b313e" stroke="#4b5363"/><text x="211.2" y="123" font-size="11" fill="#9aa3b2" text-anchor="middle" font-weight="600">§%!x</text><text x="211.2" y="135" font-size="10" fill="#9aa3b2" text-anchor="middle">6</text><rect x="240" y="110" width="43.2" height="30" fill="#191d25" stroke="#4b5363"/></g>
<g><rect x="283.2" y="110" width="57.6" height="30" fill="#2b313e" stroke="#4b5363"/><text x="312" y="123" font-size="11" fill="#e6e8ee" text-anchor="middle" font-weight="600">ERA</text><text x="312" y="135" font-size="10" fill="#9aa3b2" text-anchor="middle">2</text><rect x="340.8" y="110" width="14.4" height="30" fill="#23324a" stroke="#4b5363"/></g>
<g><rect x="355.2" y="110" width="57.6" height="30" fill="#2b313e" stroke="#4b5363"/><text x="384" y="123" font-size="11" fill="#e6e8ee" text-anchor="middle" font-weight="600">OWNR</text><text x="384" y="135" font-size="10" fill="#9aa3b2" text-anchor="middle">12</text><rect x="412.8" y="110" width="86.4" height="30" fill="#23324a" stroke="#4b5363"/></g>
<g><rect x="499.2" y="110" width="57.6" height="30" fill="#2b313e" stroke="#4b5363"/><text x="528" y="123" font-size="11" fill="#e6e8ee" text-anchor="middle" font-weight="600">SIDE</text><text x="528" y="135" font-size="10" fill="#9aa3b2" text-anchor="middle">12</text><rect x="556.8" y="110" width="86.4" height="30" fill="#23324a" stroke="#4b5363"/></g>
<path d="M28,110 C28,84 96,84 96,108" fill="none" stroke="#9aa3b2" stroke-width="1.3" marker-end="url(#head)"/>
<text x="62" y="86" font-size="10.5" fill="#9aa3b2" text-anchor="middle">8 + 2</text>
<path d="M100,110 C100,84 182.4,84 182.4,108" fill="none" stroke="#9aa3b2" stroke-width="1.3" marker-end="url(#head)"/>
<text x="141.2" y="86" font-size="10.5" fill="#9aa3b2" text-anchor="middle">8 + 4</text>
<path d="M186.4,110 C186.4,84 283.2,84 283.2,108" fill="none" stroke="#9aa3b2" stroke-width="1.3" marker-end="url(#head)"/>
<text x="234.8" y="86" font-size="10.5" fill="#9aa3b2" text-anchor="middle">8 + 6</text>
<path d="M287.2,110 C287.2,84 355.2,84 355.2,108" fill="none" stroke="#9aa3b2" stroke-width="1.3" marker-end="url(#head)"/>
<text x="321.2" y="86" font-size="10.5" fill="#9aa3b2" text-anchor="middle">8 + 2</text>
<path d="M359.2,110 C359.2,84 499.2,84 499.2,108" fill="none" stroke="#9aa3b2" stroke-width="1.3" marker-end="url(#head)"/>
<text x="429.2" y="86" font-size="10.5" fill="#9aa3b2" text-anchor="middle">8 + 12</text>
<text x="232.8" y="156" font-size="11" fill="#9aa3b2" text-anchor="middle">a name it does not know: passed over</text>
<text x="24" y="184" font-size="12.5" fill="#e6e8ee" text-anchor="start">A negative length jumps back, and the game reads old bytes as new headers</text>
<g><rect x="24" y="218" width="57.6" height="30" fill="#2b313e" stroke="#4b5363"/><text x="52.8" y="231" font-size="11" fill="#e6e8ee" text-anchor="middle" font-weight="600">SPRP</text><text x="52.8" y="243" font-size="10" fill="#9aa3b2" text-anchor="middle">4</text><rect x="81.6" y="218" width="28.8" height="30" fill="#23324a" stroke="#4b5363"/></g>
<g><rect x="110.4" y="218" width="57.6" height="30" fill="#2b313e" stroke="#4b5363"/><text x="139.2" y="231" font-size="11" fill="#e6e8ee" text-anchor="middle" font-weight="600">STR</text><text x="139.2" y="243" font-size="10" fill="#9aa3b2" text-anchor="middle">40</text><rect x="168" y="218" width="288" height="30" fill="#23324a" stroke="#4b5363"/></g>
<g><rect x="456" y="218" width="57.6" height="30" fill="#2b313e" stroke="#4b5363"/><text x="484.8" y="231" font-size="11" fill="#e6e8ee" text-anchor="middle" font-weight="600">XXXX</text><text x="484.8" y="243" font-size="10" fill="#9aa3b2" text-anchor="middle">-38</text></g>
<rect x="240" y="221" width="57.6" height="24" fill="none" stroke="#e7c160" stroke-width="1.5"/>
<text x="268.8" y="237" font-size="10" fill="#e7c160" text-anchor="middle" font-weight="600">SPRP</text>
<path d="M483.6,248 C483.6,282 268.8,282 268.8,250" fill="none" stroke="#e7c160" stroke-width="1.4" marker-end="url(#head)"/>
<text x="523.6" y="232" font-size="11" fill="#9aa3b2" text-anchor="start">length −38: the next header is</text>
<text x="523.6" y="246" font-size="11" fill="#9aa3b2" text-anchor="start">30 bytes back, hidden in STR's text</text>
<text x="24" y="294" font-size="12.5" fill="#e6e8ee" text-anchor="start">A length past the end of the file stops the walk</text>
<g><rect x="24" y="328" width="57.6" height="30" fill="#2b313e" stroke="#4b5363"/><text x="52.8" y="341" font-size="11" fill="#e6e8ee" text-anchor="middle" font-weight="600">UNIT</text><text x="52.8" y="353" font-size="10" fill="#9aa3b2" text-anchor="middle">36</text><rect x="81.6" y="328" width="259.2" height="30" fill="#23324a" stroke="#4b5363"/></g>
<g><rect x="340.8" y="328" width="57.6" height="30" fill="#2b313e" stroke="#4b5363"/><text x="369.6" y="341" font-size="11" fill="#e6e8ee" text-anchor="middle" font-weight="600">THG2</text><text x="369.6" y="353" font-size="10" fill="#9aa3b2" text-anchor="middle">40</text><rect x="398.4" y="328" width="72" height="30" fill="#3a2a20" stroke="#4b5363"/></g>
<rect x="470.4" y="328" width="216" height="30" fill="none" stroke="#d0605a" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="578.4" y="347" font-size="10.5" fill="#f2b8b4" text-anchor="middle">the 30 bytes THG2 claims</text>
<line x1="470.4" y1="320" x2="470.4" y2="366" stroke="#e6e8ee" stroke-width="1.5"/>
<text x="470.4" y="380" font-size="10.5" fill="#9aa3b2" text-anchor="middle">end of file</text>
<text x="24" y="414" font-size="11.5" fill="#9aa3b2" text-anchor="start">A section that runs past the end is still kept, and the walk stops after it. It refuses the map only if a read takes that</text><text x="24" y="430" font-size="11.5" fill="#9aa3b2" text-anchor="start">section, as every read checks a section's bytes are really there. Fewer than 8 bytes after the last section are ignored.</text><text x="24" y="446" font-size="11.5" fill="#9aa3b2" text-anchor="start">A protector hides a second SPRP this way, and the map list shows the name it points at. A length of −8 lands on the</text><text x="24" y="462" font-size="11.5" fill="#9aa3b2" text-anchor="start">same header again, for ever: the game hangs.</text>
</svg>
