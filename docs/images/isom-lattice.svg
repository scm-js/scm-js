<polygon points="136,156 248,212 136,268 24,212" fill="#2a3b55" stroke="#e7c160" stroke-width="1.5"/>
<polygon points="360,156 472,212 360,268 248,212" fill="#23324a" stroke="#e7c160" stroke-width="1.5"/>
