<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 334" width="760" height="334" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">The ISOM lattice</title>
<desc id="d">Tiles, the rects two tiles wide that ISOM stores, and the diamonds centred on every other lattice point. Each rect is cut by one diagonal into a quarter of two diamonds, and its four words say which.</desc>
<rect width="760" height="334" rx="10" fill="#12151b"/>
<defs><clipPath id="map"><rect x="24" y="44" width="336" height="168"/></clipPath></defs>
<g clip-path="url(#map)">
<polygon points="24,-12 136,44 24,100 -88,44" fill="#23324a" stroke="#e7c160" stroke-width="1.5"/>
<polygon points="248,-12 360,44 248,100 136,44" fill="#1f2c42" stroke="#e7c160" stroke-width="1.5"/>
<polygon points="136,44 248,100 136,156 24,100" fill="#4f7fbf" stroke="#e7c160" stroke-width="1.5"/>
<polygon points="360,44 472,100 360,156 248,100" fill="#23324a" stroke="#e7c160" stroke-width="1.5"/>
