<text x="24" y="26" font-size="14" fill="#e6e8ee" text-anchor="start" font-weight="600">Diamonds on the map's top-left corner</text>
<text x="24" y="234" font-size="12" fill="#9aa3b2" text-anchor="start">Dashed: tiles. Solid: rects, two tiles wide.</text>
<text x="24" y="252" font-size="12" fill="#9aa3b2" text-anchor="start">Gold dots: diamond centres, where x + y is even.</text>
<text x="408" y="26" font-size="14" fill="#e6e8ee" text-anchor="start" font-weight="600">Rect (1,1): four words</text>
<polygon points="408,78 648,78 408,198" fill="#4f7fbf"/>
<polygon points="648,78 648,198 408,198" fill="#8a6bb8"/>
<line x1="648" y1="78" x2="408" y2="198" stroke="#e7c160" stroke-width="2"/>
<rect x="408" y="78" width="240" height="120" fill="none" stroke="#e6e8ee" stroke-width="2.5"/>
<circle cx="408" cy="78" r="5" fill="#e7c160"/><circle cx="648" cy="198" r="5" fill="#e7c160"/>
<text x="420" y="104" font-size="13" fill="#e6e8ee" text-anchor="start">diamond (1,1):</text>
<text x="420" y="121" font-size="11" fill="#e6e8ee" text-anchor="start">its bottom-right quarter</text>
<text x="636" y="168" font-size="13" fill="#e6e8ee" text-anchor="end">diamond (2,2):</text>
<text x="636" y="185" font-size="11" fill="#e6e8ee" text-anchor="end">its top-left quarter</text>
<text x="398" y="142" font-size="12" fill="#e7c160" text-anchor="end">left</text>
<text x="528" y="68" font-size="12" fill="#e7c160" text-anchor="middle">top</text>
<text x="658" y="142" font-size="12" fill="#e7c160" text-anchor="start">right</text>
<text x="528" y="218" font-size="12" fill="#e7c160" text-anchor="middle">bottom</text>
<text x="408" y="248" font-size="12" fill="#e7c160" text-anchor="start">left</text>
<text x="470" y="248" font-size="12" fill="#e6e8ee" text-anchor="start">(1,1)'s value, flags 0x8</text>
<text x="408" y="267" font-size="12" fill="#e7c160" text-anchor="start">top</text>
<text x="470" y="267" font-size="12" fill="#e6e8ee" text-anchor="start">(1,1)'s value, flags 0xA</text>
<text x="408" y="286" font-size="12" fill="#e7c160" text-anchor="start">right</text>
<text x="470" y="286" font-size="12" fill="#e6e8ee" text-anchor="start">(2,2)'s value, flags 0x0</text>
<text x="408" y="305" font-size="12" fill="#e7c160" text-anchor="start">bottom</text>
<text x="470" y="305" font-size="12" fill="#e6e8ee" text-anchor="start">(2,2)'s value, flags 0x2</text>
</svg>
