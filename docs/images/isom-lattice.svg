<line x1="360" y1="44" x2="360" y2="212" stroke="#4b5363"/>
<rect x="136" y="100" width="112" height="56" fill="none" stroke="#e6e8ee" stroke-width="2.5"/>
</g>
<circle cx="24" cy="44" r="4.5" fill="#e7c160"/>
<text x="38" y="61" font-size="12" fill="#e6e8ee" text-anchor="start">(0,0)</text>
