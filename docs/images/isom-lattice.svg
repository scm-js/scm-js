<line x1="136" y1="44" x2="136" y2="212" stroke="#262b36" stroke-dasharray="3 3"/>
<line x1="192" y1="44" x2="192" y2="212" stroke="#262b36" stroke-dasharray="3 3"/>
<line x1="248" y1="44" x2="248" y2="212" stroke="#262b36" stroke-dasharray="3 3"/>
<line x1="304" y1="44" x2="304" y2="212" stroke="#262b36" stroke-dasharray="3 3"/>
<line x1="360" y1="44" x2="360" y2="212" stroke="#262b36" stroke-dasharray="3 3"/>
<line x1="24" y1="44" x2="360" y2="44" stroke="#4b5363"/>
<line x1="24" y1="100" x2="360" y2="100" stroke="#4b5363"/>
