<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 428" width="760" height="428" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">The fourteen ISOM edge shapes</title>
<desc id="d">Each diamond of an edge set is one of fourteen shapes: four straight edges, four corners of the inside terrain, four corners of the outside terrain and two crossings.</desc>
