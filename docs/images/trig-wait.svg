<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 314" width="760" height="314" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">One wait slot per player</title>
<desc id="d">Each player has one wait slot. Trigger 1's Wait holds it; Trigger 2, with no Wait, runs every pass; Trigger 3 reaches a Wait, finds the slot busy, and stops there to try again next pass. Another player's slot is separate.</desc>
<rect width="760" height="314" rx="10" fill="#12151b"/>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker></defs>
<text x="24" y="30" font-size="15" fill="#e6e8ee" text-anchor="start" font-weight="600">One wait slot per player</text>
<text x="28" y="50" font-size="12" fill="#9aa3b2" text-anchor="start">Player 1's triggers</text>
<rect x="28" y="56" width="330" height="46" rx="6" fill="#191d25" stroke="#4b5363"/>
<rect x="28" y="56" width="5" height="46" rx="2" fill="#c9963c"/>
<text x="44" y="75" font-size="12.5" fill="#e6e8ee" text-anchor="start" font-weight="600">Trigger 1</text>
<text x="124" y="75" font-size="12" fill="#e6e8ee" text-anchor="start">Wait(1000) holds the slot</text>
<text x="44" y="92" font-size="11" fill="#9aa3b2" text-anchor="start">Its actions after the Wait run when the time is up.</text>
<rect x="28" y="114" width="330" height="46" rx="6" fill="#191d25" stroke="#4b5363"/>
<rect x="28" y="114" width="5" height="46" rx="2" fill="#6fbf73"/>
<text x="44" y="133" font-size="12.5" fill="#e6e8ee" text-anchor="start" font-weight="600">Trigger 2</text>
<text x="124" y="133" font-size="12" fill="#e6e8ee" text-anchor="start">no Wait</text>
<text x="44" y="150" font-size="11" fill="#9aa3b2" text-anchor="start">Runs every pass, as if nothing were waiting.</text>
<rect x="28" y="172" width="330" height="46" rx="6" fill="#191d25" stroke="#4b5363"/>
<rect x="28" y="172" width="5" height="46" rx="2" fill="#d0605a"/>
<text x="44" y="191" font-size="12.5" fill="#e6e8ee" text-anchor="start" font-weight="600">Trigger 3</text>
<text x="124" y="191" font-size="12" fill="#e6e8ee" text-anchor="start">reaches a Wait</text>
<text x="44" y="208" font-size="11" fill="#9aa3b2" text-anchor="start">Stops there, starts no time, and tries again each pass.</text>
<rect x="428" y="86" width="240" height="74" rx="8" fill="#2b313e" stroke="#e7c160" stroke-width="1.5"/>
<text x="548" y="110" font-size="13" fill="#e6e8ee" text-anchor="middle" font-weight="600">Player 1's wait slot</text>
<text x="548" y="130" font-size="12" fill="#e8c486" text-anchor="middle">taken by Trigger 1</text>
<text x="548" y="147" font-size="11" fill="#9aa3b2" text-anchor="middle">free again when its time is up</text>
<line x1="362" y1="79" x2="424" y2="112" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<path d="M362,195 C398,195 398,146 424,142" fill="none" stroke="#d0605a" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#head)"/>
<text x="388" y="178" font-size="10.5" fill="#f2b8b4" text-anchor="end">busy: wait</text>
<rect x="428" y="184" width="240" height="30" rx="5" fill="#191d25" stroke="#4b5363" stroke-width="1.2"/><text x="548" y="203.14" font-size="11.5" fill="#e6e8ee" text-anchor="middle">Player 2's slot: separate</text>
<text x="24" y="256" font-size="11.5" fill="#9aa3b2" text-anchor="start">A Transmission for a person, and Center View in a single-player game, use the same slot. Hyper triggers keep the</text><text x="24" y="272" font-size="11.5" fill="#9aa3b2" text-anchor="start">slot busy: a Wait below them in the list can start only in the one slow pass; a Wait above them takes the slot</text><text x="24" y="288" font-size="11.5" fill="#9aa3b2" text-anchor="start">first, and the passes fall back to every 31 frames until it runs out.</text>
</svg>
