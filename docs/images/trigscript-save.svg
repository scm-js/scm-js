<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 752" width="480" height="752" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">What saving does with a script</title>
<desc id="d">The script's files are kept in the map. Saving first applies the script: it runs once in the editor, each trigger() call becomes a trigger in the map's trigger list as one block among the hand-made triggers, and the program() bodies are kept for the build. Then the build lays the programs into the saved file as the game's own triggers. The saved file holds the trigger list, the built programs, the script's files and the map as the editor shows it. A map with a program needs StarCraft: Remastered.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3b2"/></marker></defs>
<rect width="480" height="752" rx="10" fill="#12151b"/>
<text x="24" y="34" font-size="16" fill="#e6e8ee" font-weight="600">What saving does with a script</text>

<rect x="24" y="50" width="432" height="78" rx="8" fill="#191d25" stroke="#4b5363"/>
<text x="40" y="74" font-size="14" fill="#e6e8ee" font-weight="600">The script</text>
<text x="440" y="74" font-size="12.5" fill="#9aa3b2" text-anchor="end">kept in the map</text>
<rect x="40" y="88" width="78" height="26" rx="5" fill="#222732" stroke="#4b5363"/>
<text x="79" y="105.5" font-size="13" fill="#e6e8ee" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">main.ts</text>
<rect x="126" y="88" width="86" height="26" rx="5" fill="#222732" stroke="#4b5363"/>
<text x="169" y="105.5" font-size="13" fill="#e6e8ee" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">waves.ts</text>
<rect x="220" y="88" width="78" height="26" rx="5" fill="#222732" stroke="#4b5363"/>
<text x="259" y="105.5" font-size="13" fill="#e6e8ee" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">shop.ts</text>

<line x1="240" y1="128" x2="240" y2="152" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>

<rect x="24" y="156" width="432" height="64" rx="8" fill="#222732" stroke="#e7c160" stroke-width="1.5"/>
<text x="40" y="180" font-size="14" fill="#e7c160" font-weight="600">1</text>
<text x="56" y="180" font-size="14" fill="#e6e8ee" font-weight="600">Apply</text>
<text x="40" y="203" font-size="13.5" fill="#e6e8ee">The script runs once, in the editor.</text>

<line x1="128" y1="220" x2="128" y2="250" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="352" y1="220" x2="352" y2="250" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>

<rect x="24" y="254" width="208" height="186" rx="8" fill="#191d25" stroke="#4b5363"/>
<text x="38" y="278" font-size="13.5" fill="#e6e8ee" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">trigger() calls</text>
<rect x="38" y="292" width="180" height="22" rx="4" fill="#222732" stroke="#4b5363"/>
<text x="48" y="307.5" font-size="12" fill="#9aa3b2">hand-made trigger</text>
<rect x="34" y="320" width="188" height="82" rx="5" fill="none" stroke="#c9963c" stroke-width="1.5"/>
<rect x="40" y="326" width="176" height="20" rx="3" fill="#2b313e"/>
<text x="48" y="340" font-size="12" fill="#e6e8ee">trigger 1</text>
<text x="208" y="340" font-size="11" fill="#e7c160" text-anchor="end">script</text>
<rect x="40" y="350" width="176" height="20" rx="3" fill="#2b313e"/>
<text x="48" y="364" font-size="12" fill="#e6e8ee">trigger 2</text>
<text x="208" y="364" font-size="11" fill="#e7c160" text-anchor="end">script</text>
<rect x="40" y="374" width="176" height="20" rx="3" fill="#2b313e"/>
<text x="48" y="388" font-size="12" fill="#e6e8ee">trigger 3</text>
<text x="208" y="388" font-size="11" fill="#e7c160" text-anchor="end">script</text>
<rect x="38" y="408" width="180" height="22" rx="4" fill="#222732" stroke="#4b5363"/>
<text x="48" y="423.5" font-size="12" fill="#9aa3b2">hand-made trigger</text>

<rect x="248" y="254" width="208" height="186" rx="8" fill="#191d25" stroke="#4b5363"/>
<text x="262" y="278" font-size="13.5" fill="#e6e8ee" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">program() bodies</text>
<rect x="262" y="292" width="180" height="26" rx="5" fill="#1b2433" stroke="#4f7fbf"/>
<text x="352" y="309.5" font-size="12" fill="#e6e8ee" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">program(() =&gt; { … })</text>
<rect x="262" y="326" width="180" height="26" rx="5" fill="#1b2433" stroke="#4f7fbf"/>
<text x="352" y="343.5" font-size="12" fill="#e6e8ee" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">program(() =&gt; { … })</text>
<text x="262" y="380" font-size="12.5" fill="#9aa3b2">Kept for the build.</text>
<text x="262" y="399" font-size="12.5" fill="#9aa3b2">They put nothing in</text>
<text x="262" y="418" font-size="12.5" fill="#9aa3b2">the trigger list.</text>

<text x="128" y="458" font-size="12" fill="#9aa3b2" text-anchor="middle">in the map's trigger list</text>
<line x1="128" y1="464" x2="128" y2="490" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>
<line x1="352" y1="440" x2="352" y2="490" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>

<rect x="24" y="494" width="432" height="64" rx="8" fill="#222732" stroke="#e7c160" stroke-width="1.5"/>
<text x="40" y="518" font-size="14" fill="#e7c160" font-weight="600">2</text>
<text x="56" y="518" font-size="14" fill="#e6e8ee" font-weight="600">Build</text>
<text x="40" y="541" font-size="13.5" fill="#e6e8ee">The programs become the game's own triggers.</text>

<line x1="240" y1="558" x2="240" y2="582" stroke="#9aa3b2" stroke-width="1.4" marker-end="url(#head)"/>

<rect x="24" y="586" width="432" height="136" rx="8" fill="#191d25" stroke="#4b5363"/>
<text x="40" y="610" font-size="14" fill="#e6e8ee" font-weight="600">The saved .scx</text>
<rect x="40" y="620" width="400" height="24" rx="4" fill="#222732" stroke="#c9963c"/>
<text x="50" y="636.5" font-size="12.5" fill="#e6e8ee">the trigger list, with the script's block</text>
<rect x="40" y="650" width="400" height="24" rx="4" fill="#1b2433" stroke="#4f7fbf"/>
<text x="50" y="666.5" font-size="12.5" fill="#e6e8ee">the programs, laid out as the game's own triggers</text>
<rect x="40" y="680" width="400" height="24" rx="4" fill="#222732" stroke="#4b5363"/>
<text x="50" y="696.5" font-size="12.5" fill="#e6e8ee">the script's files, and the map as the editor shows it</text>
<text x="24" y="740" font-size="12.5" fill="#9aa3b2">With a program in it, the map needs StarCraft: Remastered.</text>
</svg>
