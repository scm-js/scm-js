# Packaging for the desktop build (`npm run build:desktop`). The web bundle in dist/ and the
# bundled main process in desktop/dist/ are all that ships: no node_modules, and never the
# game data a developer's public/ may hold — the app extracts that on the user's machine.
appId: dev.scmjs.editor
productName: scmJS
copyright: MIT
directories:
  output: release
  buildResources: desktop/build
files:
  - "!node_modules/**"
  - dist/**/*
  - "!dist/tileset/**"
  - "!dist/arr/**"
  - "!dist/unit/**"
  - "!dist/game/**"
  - "!dist/scripts/**"
  - desktop/dist/**/*
  - package.json
asar: true
# Chromium ships 55 UI locales (50 MB unpacked, 12 MB of the zip); the editor has no translations
# and the few strings Chromium itself shows (context menus, file pickers) read fine in English.
electronLanguages:
  - en-US
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
win:
  # One 1024² PNG for every platform — the app mark in public/, which the web build also
  # serves as its icon; electron-builder makes the .ico / .icns from it.
  icon: public/icon.png
  # A zip rather than electron-builder's `portable` target: that one is a 7-Zip SFX whose
  # NSIS template does `RMDir /r $INSTDIR` and re-extracts the whole app into `%TEMP%` on
  # *every* launch (there is no cache, `unpackDirName` or not), and the only thing it offers
  # to cover the wait is a static .bmp painted over the whole desktop by the BgImage plugin.
  # A zip is unpacked once by the user and every launch after it is the ordinary one.
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
mac:
  icon: public/icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
  # Unsigned until there is an Apple Developer identity; CI sets CSC_IDENTITY_AUTO_DISCOVERY=false.
  identity: null
  hardenedRuntime: false
linux:
  icon: public/icon.png
  category: Development
  maintainer: scm-js
  target:
    - AppImage
    - deb
