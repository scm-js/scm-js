<!-- The app mark cut for an OAuth consent screen. Same drawing as `favicon.svg` (see
     `components/ui/AppLogo.tsx`) with three changes the small sizes need: full bleed, because
     Discord and Google both mask the icon to a circle and the rounded square's dark corners read
     as a halo inside one; the two faintest lattice tiers dropped, which are texture at 1024 px and
     noise at 32; and the globe scaled with what is left thickened, so it still reads as a globe
     when the provider draws it at 32. `icon-512.png` (Discord) and `icon-120.png` (Google) are
     this file rendered at those sizes — re-render them if it changes. -->
